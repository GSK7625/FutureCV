<body class="bg-navy min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-body-md text-surface-bright">
<!-- Background Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-10" style="background-image: radial-gradient(#C8963E 1px, transparent 1px); background-size: 32px 32px;"></div>
<div class="w-full max-w-[480px] bg-surface-container-lowest text-on-surface rounded-xl shadow-2xl relative z-10 border border-outline-variant/30">
<!-- Accent Top Border -->
<div class="h-1 w-full bg-gold"></div>
<div class="p-8 sm:p-10">
<!-- Header -->
<div class="text-center mb-10">
<div class="flex items-center justify-center gap-2 text-navy mb-2">
<span class="material-symbols-outlined text-4xl text-gold" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-headline-md text-2xl font-bold tracking-tight uppercase text-navy">FutureCV</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Đăng nhập</h2>
<p class="font-body-md text-body-md text-secondary">Chào mừng bạn quay trở lại với tương lai sự nghiệp.</p>
</div>
<!-- Social Login -->
<div class="space-y-4 mb-8">
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant rounded-lg hover:border-gold hover:bg-surface-bright transition-colors text-on-surface font-label-md text-label-md">
<span class="material-symbols-outlined text-xl text-on-surface-variant">login</span>
                    Tiếp tục với Google
                </button>
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant rounded-lg hover:border-gold hover:bg-surface-bright transition-colors text-on-surface font-label-md text-label-md">
<span class="material-symbols-outlined text-xl text-on-surface-variant">qr_code_2</span>
                    Tiếp tục với Facebook
                </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 mb-8">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-secondary uppercase">Hoặc</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<!-- Form -->
<form class="space-y-6">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email / Số điện thoại</label>
<input class="w-full px-4 py-3 border border-outline-variant rounded-lg focus:outline-none focus:border-navy focus:ring-2 focus:ring-navy/20 transition-all font-body-md text-body-md" id="email" placeholder="Nhập email hoặc số điện thoại của bạn" type="text">
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Mật khẩu</label>
<a class="font-label-sm text-label-sm text-gold hover:underline" href="#">Quên mật khẩu?</a>
</div>
<div class="relative">
<input class="w-full px-4 py-3 border border-outline-variant rounded-lg focus:outline-none focus:border-navy focus:ring-2 focus:ring-navy/20 transition-all font-body-md text-body-md pr-12" id="password" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary hover:text-navy transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-navy text-white border border-navy rounded-lg font-label-md hover:bg-opacity-90 transition-all focus:outline-none focus:ring-2 focus:ring-navy shadow-md mt-4" type="submit">
<span class="material-symbols-outlined text-xl text-gold">login</span>
                        Đăng nhập
                    </button>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-secondary">
                    Bạn chưa có tài khoản? <a class="text-gold font-semibold hover:underline" href="#">Đăng ký ngay</a>
</p>
