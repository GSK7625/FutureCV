<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Đăng ký - Velocity Talent</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "midnight": "#0B132B",
                        "gold": "#C8963E",
                        "gold-light": "#d4a755",
                        "surface": "#f7f9fb",
                        "surface-dim": "#d8dadc",
                        "on-surface": "#191c1e",
                        "on-surface-variant": "#545f73",
                        "outline-variant": "#bccbb9",
                    },
                    fontFamily: {
                        "body-sm": ["Hanken Grotesk", "sans-serif"],
                        "body-md": ["Hanken Grotesk", "sans-serif"],
                        "body-lg": ["Hanken Grotesk", "sans-serif"],
                        "headline-md": ["Hanken Grotesk", "sans-serif"],
                        "headline-lg": ["Hanken Grotesk", "sans-serif"],
                        "label-sm": ["Hanken Grotesk", "sans-serif"],
                        "label-md": ["Hanken Grotesk", "sans-serif"],
                    },
                },
            },
        }
    </script>
<style>
        .geometric-watermark {
            background-image: radial-gradient(rgba(200, 150, 62, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="bg-midnight min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden font-body-md text-on-surface">
<!-- Geometric Watermark -->
<div class="absolute inset-y-0 left-0 w-full geometric-watermark pointer-events-none z-0 hidden md:block"></div>
<!-- Main Content Container -->
<main class="w-full max-w-[480px] px-4 md:px-0 z-10 relative flex flex-col gap-6 my-8">
<!-- Sign Up Card -->
<div class="bg-white rounded-xl shadow-2xl overflow-hidden border-t-4 border-gold">
<!-- Card Header -->
<div class="p-8 border-b border-gray-100 flex flex-col gap-3 text-center">
<div class="flex items-center justify-center gap-2 text-midnight mb-2">
<span class="material-symbols-outlined text-4xl text-gold" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-headline-md text-2xl font-bold tracking-tight uppercase text-midnight">FUturecv</span>
</div>
<h1 class="font-headline-lg text-3xl text-midnight font-semibold">Đăng ký</h1>
<p class="font-body-md text-gray-500">Tạo tài khoản miễn phí, tìm kiếm hơn 60.000 việc làm.</p>
</div>
<!-- Card Body -->
<div class="p-8 flex flex-col gap-5">
<!-- Social Auth -->
<div class="flex flex-col gap-4">
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-gray-200 rounded-lg font-label-md text-midnight hover:border-gold hover:bg-gray-50 transition-all focus:outline-none focus:ring-2 focus:ring-gold bg-white shadow-sm">
<span class="material-symbols-outlined text-xl text-gray-700" data-icon="login">login</span>
                        Tiếp tục với Google
                    </button>
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-gray-200 rounded-lg font-label-md text-midnight hover:border-gold hover:bg-gray-50 transition-all focus:outline-none focus:ring-2 focus:ring-gold bg-white shadow-sm">
<span class="material-symbols-outlined text-xl text-gray-700" data-icon="qr_code_2">qr_code_2</span>
                        Tiếp tục với Facebook
                    </button>
</div>
<!-- Divider -->
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-gray-200"></div>
<span class="flex-shrink-0 mx-4 text-gray-400 font-label-sm uppercase tracking-widest text-xs">Hoặc</span>
<div class="flex-grow border-t border-gray-200"></div>
</div>
<!-- Email Auth -->
<div class="flex flex-col gap-4">
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-midnight text-white border border-midnight rounded-lg font-label-md hover:bg-gray-900 transition-all focus:outline-none focus:ring-2 focus:ring-midnight shadow-md">
<span class="material-symbols-outlined text-xl text-gold" data-icon="mail">mail</span>
                        Đăng ký bằng Email
                    </button>
<div class="flex items-start gap-3 mt-2">
<input class="mt-1 h-4 w-4 rounded border-gray-300 text-midnight focus:ring-midnight bg-white" id="terms" type="checkbox">
<label class="font-body-sm text-sm text-gray-500 leading-tight" for="terms">
                            Tôi đã đọc và đồng ý với Điều khoản dịch vụ và Chính sách quyền riêng tư của Velocity Talent (Bắt buộc)
                        </label>
</div>
</div>
</div>
<!-- Card Footer -->
<div class="p-6 bg-gray-50 text-center border-t border-gray-100">
<p class="font-body-sm text-gray-600">
                    Bạn đã có tài khoản? <a class="text-gold font-semibold hover:underline" href="#">Đăng nhập ngay</a>
</p>
</div>
</div>
<!-- Help Alert -->

<!-- Copyright -->
<p class="text-center font-body-sm text-xs text-gray-500 mt-2">
            © 2016. All Rights Reserved. Velocity Talent Vietnam JSC.
        </p>
</main>


</body></html>
